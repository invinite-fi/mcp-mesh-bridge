name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Bash on every runner, Windows included, so that the vendored Yarn is found by
# its glob whatever its version.
defaults:
  run:
    shell: bash

jobs:
  validate:
    # A public repository: GitHub-hosted runners only, never self-hosted ones,
    # which a pull request from a fork would otherwise run code on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The vendored Yarn. Dependencies run no install scripts (.yarnrc.yml), and
      # esbuild finds its binary without one.
      - run: node .yarn/releases/yarn-*.cjs install --immutable
      - run: node .yarn/releases/yarn-*.cjs validate
      - name: No known vulnerability in what ships
        if: matrix.os == 'ubuntu-latest'
        run: node .yarn/releases/yarn-*.cjs npm audit --environment production
      - run: node .yarn/releases/yarn-*.cjs bundle
      - name: The packed bundle relays over stdio
        run: node --test build/test/stdio.test.js
        env:
          BRIDGE_MAIN: dist/stage/server/index.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node .yarn/releases/yarn-*.cjs install --immutable
      - name: The tag is the manifest's version
        run: test "v$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - run: node .yarn/releases/yarn-*.cjs bundle
      - name: Release the .mcpb
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*.mcpb --title "$GITHUB_REF_NAME" --generate-notes
